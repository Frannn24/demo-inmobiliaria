<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin | Servicios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-4 text-center text-xl font-bold border-b border-gray-700">Picca Admin</div>
            <nav class="flex-1 mt-4">
                <a href="dashboard-propiedades.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-home w-6"></i> Propiedades</a>
                <a href="dashboard-consultas.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-inbox w-6"></i> Consultas
                    <span class="ml-auto bg-red-500 text-xs rounded-full px-2 py-0.5">2</span></a>
                <a href="dashboard-demandas.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-users w-6"></i> Demandas</a>
                <a href="dashboard-clientes.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-address-book w-6"></i> Clientes CRM</a>
                <a href="dashboard-categorias.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-tags w-6"></i> Categorías</a>
                <a href="dashboard-servicios.html" class="flex items-center px-4 py-3 bg-gray-900 border-l-4 border-blue-500"><i class="fas fa-briefcase w-6"></i> Servicios</a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Gestión de Servicios</h1>
                    <p class="text-gray-600 text-sm">Estos bloques aparecen en la página principal bajo "Otros Servicios".</p>
                </div>
                <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 flex items-center shadow">
                    <i class="fas fa-plus mr-2"></i> Nuevo Servicio
                </button>
            </div>

            <div id="servicesGrid" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                </div>
        </main>
    </div>

    <div id="serviceModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden">
            <div class="bg-blue-600 p-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg" id="modalTitle">Nuevo Servicio</h3>
                <button onclick="closeModal()" class="hover:text-gray-200"><i class="fas fa-times"></i></button>
            </div>
            <form id="serviceForm" class="p-6 space-y-4">
                <input type="hidden" id="serviceId">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Título del Servicio</label>
                    <input type="text" id="sTitle" class="w-full border p-2 rounded focus:border-blue-500 outline-none" placeholder="Ej: Asesoría Legal">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Icono</label>
                        <select id="sIcon" class="w-full border p-2 rounded bg-white">
                            <option value="fas fa-home">Casa (Inmob)</option>
                            <option value="fas fa-car">Auto (Gestoría)</option>
                            <option value="fas fa-shield-alt">Escudo (Seguros)</option>
                            <option value="fas fa-briefcase">Maletín (Legal)</option>
                            <option value="fas fa-calculator">Calculadora (Contable)</option>
                            <option value="fas fa-key">Llave</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Estado</label>
                        <select id="sStatus" class="w-full border p-2 rounded bg-white">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo (Oculto)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Descripción Corta</label>
                    <textarea id="sDesc" rows="2" class="w-full border p-2 rounded focus:border-blue-500 outline-none" placeholder="Breve descripción para la web..."></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Lista de Items (1 por renglón)</label>
                    <textarea id="sItems" rows="4" class="w-full border p-2 rounded focus:border-blue-500 outline-none font-mono text-sm bg-gray-50" placeholder="Venta de propiedades&#10;Alquileres&#10;Tasaciones"></textarea>
                    <p class="text-xs text-gray-500 mt-1">Escribí cada característica en una nueva línea.</p>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Datos iniciales simulados (Base de datos)
        let services = [
            {
                id: 1,
                title: "Asesoría Inmobiliaria",
                icon: "fas fa-home",
                desc: "Asesoramiento integral para la compra, venta y alquiler de inmuebles.",
                items: ["Venta de propiedades", "Alquileres temporarios", "Tasaciones profesionales"],
                active: true
            },
            {
                id: 2,
                title: "Gestoría Automotor",
                icon: "fas fa-car",
                desc: "Trámites vehiculares ágiles y seguros para tu tranquilidad.",
                items: ["Transferencias", "Altas y bajas", "Informes de dominio"],
                active: true
            },
            {
                id: 3,
                title: "Seguros Generales",
                icon: "fas fa-shield-alt",
                desc: "Protección para tus bienes y tu familia con las mejores coberturas.",
                items: ["Seguros del hogar", "Automotores", "Vida y Accidentes"],
                active: true
            }
        ];

        // Renderizar Grid
        function renderServices() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';

            services.forEach(service => {
                const statusBadge = service.active 
                    ? '<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full border border-green-200">Activo</span>'
                    : '<span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-full border border-gray-200">Inactivo</span>';

                // Convertir array de items a HTML
                const itemsHtml = service.items.map(item => 
                    `<li class="flex items-center gap-2"><i class="fas fa-check text-green-500 text-xs"></i> ${item}</li>`
                ).join('');

                const card = `
                    <div class="bg-white rounded-lg shadow hover:shadow-md transition overflow-hidden flex flex-col h-full relative group">
                        <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition">
                            <button onclick="editService(${service.id})" class="text-blue-600 bg-blue-50 p-2 rounded hover:bg-blue-100 mr-1" title="Editar"><i class="fas fa-pencil-alt"></i></button>
                            <button onclick="deleteService(${service.id})" class="text-red-600 bg-red-50 p-2 rounded hover:bg-red-100" title="Eliminar"><i class="fas fa-trash"></i></button>
                        </div>
                        
                        <div class="p-6 flex-1">
                            <div class="flex justify-between items-start mb-4">
                                <div class="bg-blue-100 w-12 h-12 rounded-full flex items-center justify-center text-blue-600 text-xl">
                                    <i class="${service.icon}"></i>
                                </div>
                                ${statusBadge}
                            </div>
                            <h3 class="font-bold text-xl text-gray-800 mb-2">${service.title}</h3>
                            <p class="text-gray-600 text-sm mb-4">${service.desc}</p>
                            <ul class="text-sm text-gray-500 space-y-1 bg-gray-50 p-3 rounded">
                                ${itemsHtml}
                            </ul>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // Abrir Modal (Crear)
        function openModal() {
            document.getElementById('serviceForm').reset();
            document.getElementById('serviceId').value = '';
            document.getElementById('modalTitle').innerText = 'Nuevo Servicio';
            document.getElementById('serviceModal').classList.remove('hidden');
        }

        // Abrir Modal (Editar)
        function editService(id) {
            const service = services.find(s => s.id === id);
            if (!service) return;

            document.getElementById('serviceId').value = service.id;
            document.getElementById('sTitle').value = service.title;
            document.getElementById('sIcon').value = service.icon;
            document.getElementById('sStatus').value = service.active.toString();
            document.getElementById('sDesc').value = service.desc;
            document.getElementById('sItems').value = service.items.join('\n'); // Join con saltos de línea

            document.getElementById('modalTitle').innerText = 'Editar Servicio';
            document.getElementById('serviceModal').classList.remove('hidden');
        }

        // Cerrar Modal
        function closeModal() {
            document.getElementById('serviceModal').classList.add('hidden');
        }

        // Eliminar Servicio
        function deleteService(id) {
            if(confirm('¿Estás seguro de eliminar este servicio?')) {
                services = services.filter(s => s.id !== id);
                renderServices();
            }
        }

        // Guardar (Create / Update)
        document.getElementById('serviceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('serviceId').value;
            const title = document.getElementById('sTitle').value;
            const icon = document.getElementById('sIcon').value;
            const desc = document.getElementById('sDesc').value;
            const active = document.getElementById('sStatus').value === 'true';
            
            // Convertir texto de items a array (separar por enter y limpiar vacíos)
            const itemsText = document.getElementById('sItems').value;
            const items = itemsText.split('\n').map(i => i.trim()).filter(i => i !== '');

            if (id) {
                // Update
                const index = services.findIndex(s => s.id == id);
                services[index] = { id: parseInt(id), title, icon, desc, items, active };
            } else {
                // Create
                const newId = services.length > 0 ? Math.max(...services.map(s => s.id)) + 1 : 1;
                services.push({ id: newId, title, icon, desc, items, active });
            }

            closeModal();
            renderServices();
        });

        // Inicializar
        renderServices();
    </script>
</body>
</html>
