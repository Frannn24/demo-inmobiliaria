<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin | Nueva Propiedad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-4 text-center text-xl font-bold border-b border-gray-700">Picca Admin</div>
            <nav class="flex-1 mt-4">
               <a href="dashboard-propiedades.html" class="flex items-center px-4 py-3 bg-gray-900 border-l-4 border-blue-500"><i class="fas fa-home w-6"></i> Propiedades</a>
                <a href="dashboard-demandas.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-users w-6"></i> Demandas</a>
                <a href="dashboard-clientes.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-address-book w-6"></i> Clientes CRM</a>
                <a href="dashboard-categorias.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-tags w-6"></i> Categorías</a>
                <a href="dashboard-servicios.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-briefcase w-6"></i> Servicios</a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Subir Nueva Propiedad</h1>
            <form class="bg-white shadow rounded-lg p-6 max-w-4xl">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Título</label>
                        <input type="text" class="w-full p-2 border rounded" placeholder="Ej: Casa en el centro">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Dirección (Geolocalización Auto)</label>
                        <input type="text" class="w-full p-2 border rounded" placeholder="Calle y Altura, Ciudad">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Categoría</label>
                        <div class="flex gap-2">
                            <select class="w-full p-2 border rounded bg-white">
                                <option>Casa</option>
                                <option>Departamento</option>
                                <option>Terreno</option>
                                </select>
                            <a href="dashboard-categorias.html" class="bg-gray-200 px-3 py-2 rounded hover:bg-gray-300" title="Gestionar Categorías"><i class="fas fa-cog"></i></a>
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">Precio</label>
                        <input type="text" class="w-full p-2 border rounded" placeholder="$">
                        <label class="flex items-center mt-2 text-sm text-gray-600"><input type="checkbox" class="mr-2"> Mostrar "Consultar" en lugar del precio</label>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Cancelar</button>
                    <button type="button" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Publicar y Buscar Coincidencias</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
