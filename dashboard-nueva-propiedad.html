<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Añadir Propiedad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-4 text-center text-2xl font-bold border-b border-gray-700">
                Picca Admin
            </div>
            <nav class="flex-1 mt-4">
                <a href="dashboard-propiedades.html" class="flex items-center px-4 py-3 text-gray-400 hover:bg-gray-700">
                    <i class="fas fa-home w-6 text-center"></i>
                    <span class="ml-2">Mis Propiedades</span>
                </a>
                <a href="dashboard-nueva-propiedad.html" class="flex items-center px-4 py-3 bg-gray-900 text-white">
                    <i class="fas fa-plus w-6 text-center"></i>
                    <span class="ml-2">Añadir Propiedad</span>
                </a>
                <a href="dashboard-servicios.html" class="flex items-center px-4 py-3 text-gray-400 hover:bg-gray-700">
                    <i class="fas fa-briefcase w-6 text-center"></i>
                    <span class="ml-2">Gestionar Servicios</span>
                </a>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <a href="index.html" class="flex items-center px-4 py-3 text-gray-400 hover:bg-gray-700">
                    <i class="fas fa-sign-out-alt w-6 text-center"></i>
                    <span class="ml-2">Cerrar Sesión</span>
                </a>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">Añadir Nueva Propiedad</h1>

            <form class="bg-white shadow-lg rounded-lg p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <div class="mb-4">
                            <label class="block text-gray-700 font-medium mb-2" for="titulo">Título de la Propiedad</label>
                            <input class="w-full p-2 border border-gray-300 rounded-md" id="titulo" type="text" placeholder="Ej: Casa Moderna en Barrio Jardín">
                        </div>

                        <div class="mb-4">
                            <label class="block text-gray-700 font-medium mb-2" for="descripcion">Descripción</label>
                            <textarea class="w-full p-2 border border-gray-300 rounded-md" id="descripcion" rows="5" placeholder="Describa la propiedad..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="block text-gray-700 font-medium mb-2" for="direccion">Dirección (para el mapa)</label>
                            <input class="w-full p-2 border border-gray-300 rounded-md" id="direccion" type="text" placeholder="Ej: Calle Aguibay 300, Pilar, Córdoba">
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-gray-700 font-medium mb-2" for="precio">Precio</label>
                                <input class="w-full p-2 border border-gray-300 rounded-md" id="precio" type="text" placeholder="Ej: 85000000 o 85000/mes">
                            </div>
                            <div>
                                <label class="block text-gray-700 font-medium mb-2" for="tipo">Tipo</label>
                                <select class="w-full p-2 border border-gray-300 rounded-md bg-white" id="tipo">
                                    <option>Casa</option>
                                    <option>Departamento</option>
                                    <option>Terreno</option>
                                    <option>Local</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-gray-700 font-medium mb-2">Operación</label>
                            <div class="flex space-x-4">
                                <label class="flex items-center">
                                    <input type="radio" name="operacion" value="venta" class="mr-2" checked> Venta
                                </label>
                                <label class="flex items-center">
                                    <input type="radio" name="operacion" value="alquiler" class="mr-2"> Alquiler
                                </label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="mb-4">
                            <label class="block text-gray-700 font-medium mb-2">Características</label>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="flex items-center">
                                    <i class="fas fa-bed text-blue-600 mr-2"></i>
                                    <input type="number" placeholder="Dorm." class="w-20 p-2 border border-gray-300 rounded-md">
                                </div>
                                <div class="flex items-center">
                                    <i class="fas fa-bath text-blue-600 mr-2"></i>
                                    <input type="number" placeholder="Baños" class="w-20 p-2 border border-gray-300 rounded-md">
                                </div>
                                <div class="flex items-center">
                                    <i class="fas fa-car text-blue-600 mr-2"></i>
                                    <input type="number" placeholder="Coch." class="w-20 p-2 border border-gray-300 rounded-md">
                                </div>
                                <div class="flex items-center">
                                    <i class="fas fa-ruler-combined text-blue-600 mr-2"></i>
                                    <input type="number" placeholder="m²" class="w-20 p-2 border border-gray-300 rounded-md">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-gray-700 font-medium mb-2">Fotos de la Propiedad</label>
                            <div class="border-2 border-dashed border-gray-300 rounded-md p-6 text-center">
                                <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-2"></i>
                                <p class="text-gray-500">Arrastre las fotos aquí o haga clic para subir</p>
                                <input type="file" class="hidden" multiple>
                            </div>
                            </div>

                    </div>
                </div>

                <div class="mt-6 border-t pt-6 text-right">
                    <button type="button" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition mr-2">Cancelar</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Guardar Propiedad</button>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
