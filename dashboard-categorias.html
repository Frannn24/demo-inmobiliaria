<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin | Categorías</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-4 text-center text-xl font-bold border-b border-gray-700">Picca Admin</div>
            <nav class="flex-1 mt-4">
                <a href="dashboard-propiedades.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-home w-6"></i> Propiedades</a>
                <a href="dashboard-demandas.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-users w-6"></i> Demandas</a>
                <a href="dashboard-clientes.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-address-book w-6"></i> Clientes CRM</a>
                <a href="dashboard-categorias.html" class="flex items-center px-4 py-3 bg-gray-900 border-l-4 border-blue-500"><i class="fas fa-tags w-6"></i> Categorías</a>
                <a href="dashboard-servicios.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-briefcase w-6"></i> Servicios</a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Gestión de Categorías</h1>
            <p class="mb-6 text-gray-600">Crea nuevas etiquetas para clasificar las propiedades (ej: Galpones, Cocheras).</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded shadow h-fit">
                    <h3 class="font-bold mb-4">Nueva Categoría</h3>
                    <div class="flex gap-2">
                        <input type="text" class="border p-2 rounded w-full" placeholder="Nombre (ej: Campos)">
                        <button class="bg-green-600 text-white px-4 rounded hover:bg-green-700">Crear</button>
                    </div>
                </div>

                <div class="bg-white rounded shadow overflow-hidden">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-50 border-b"><tr><th class="p-3 text-left">Nombre</th><th class="p-3 text-right">Acción</th></tr></thead>
                        <tbody class="divide-y">
                            <tr><td class="p-3">Casa</td><td class="p-3 text-right"><button class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>
                            <tr><td class="p-3">Departamento</td><td class="p-3 text-right"><button class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>
                            <tr><td class="p-3">Terreno</td><td class="p-3 text-right"><button class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>
                            <tr><td class="p-3">Local Comercial</td><td class="p-3 text-right"><button class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
