<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin | Demandas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-4 text-center text-xl font-bold border-b border-gray-700">Picca Admin</div>
            <nav class="flex-1 mt-4">
                <a href="dashboard-propiedades.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-home w-6"></i> Propiedades</a>
                <a href="dashboard-consultas.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-inbox w-6"></i> Consultas
                    <span class="ml-auto bg-red-500 text-xs rounded-full px-2 py-0.5">2</span></a>
                <a href="dashboard-demandas.html" class="flex items-center px-4 py-3 bg-gray-900 border-l-4 border-blue-500"><i class="fas fa-users w-6"></i> Demandas</a>
                <a href="dashboard-clientes.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-address-book w-6"></i> Clientes CRM</a>
                <a href="dashboard-categorias.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-tags w-6"></i> Categorías</a>
                <a href="dashboard-servicios.html" class="flex items-center px-4 py-3 hover:bg-gray-700"><i class="fas fa-briefcase w-6"></i> Servicios</a>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <h1 class="text-2xl font-bold text-gray-800 mb-4">Lista de Espera / Demandas</h1>
            
            <div class="bg-white p-4 rounded shadow mb-6 flex gap-2">
                <select class="border p-2 rounded"><option>Zona: Todas</option><option>Pilar</option><option>Rio 2</option></select>
                <select class="border p-2 rounded"><option>Tipo: Todos</option><option>Casa</option><option>Terreno</option></select>
                <button class="bg-blue-600 text-white px-4 py-2 rounded">Filtrar</button>
            </div>

            <div class="bg-white shadow rounded-lg">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="p-4 text-left">Fecha</th>
                            <th class="p-4 text-left">Cliente</th>
                            <th class="p-4 text-left">Busca</th>
                            <th class="p-4 text-left">Contacto</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        <tr>
                            <td class="p-4 text-gray-500">18/11/2025</td>
                            <td class="p-4 font-bold">Francisco Maldonado</td>
                            <td class="p-4">
                                <span class="font-bold block">Alquiler - Casa</span>
                                <span class="text-gray-500">Pilar, 2 hab, con perro</span>
                            </td>
                            <td class="p-4"><a href="#" class="text-green-600 font-bold"><i class="fab fa-whatsapp"></i> Contactar</a></td>
                        </tr>
                        <tr>
                            <td class="p-4 text-gray-500">17/11/2025</td>
                            <td class="p-4 font-bold">Ana Perez</td>
                            <td class="p-4">
                                <span class="font-bold block">Venta - Terreno</span>
                                <span class="text-gray-500">Río Segundo, Inversión</span>
                            </td>
                            <td class="p-4"><a href="#" class="text-green-600 font-bold"><i class="fab fa-whatsapp"></i> Contactar</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
