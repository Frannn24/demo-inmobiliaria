<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Búsqueda Personalizada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: sans-serif; } </style>
</head>
<body class="bg-blue-50">
    <div class="container mx-auto px-4 py-8">
        <a href="index.html" class="text-blue-600 font-bold mb-6 inline-block"><i class="fas fa-arrow-left"></i> Volver</a>
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-xl overflow-hidden">
            <div class="bg-blue-600 p-6 text-center text-white">
                <h1 class="text-2xl font-bold">Buscador Personalizado</h1>
                <p>Completá tus preferencias y te avisamos cuando ingrese algo ideal para vos.</p>
            </div>
            <form class="p-8 space-y-6">
                <div class="space-y-4">
                    <h3 class="font-bold text-gray-800 border-b pb-2">Tus Datos</h3>
                    <input type="text" class="w-full p-3 border rounded" placeholder="Nombre completo *" required>
                    <input type="tel" class="w-full p-3 border rounded" placeholder="WhatsApp *" required>
                    <input type="email" class="w-full p-3 border rounded" placeholder="Email">
                </div>
                <div class="space-y-4">
                    <h3 class="font-bold text-gray-800 border-b pb-2">¿Qué buscás?</h3>
                    <label class="block">Operación:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="border p-2 rounded flex items-center"><input type="radio" name="op" class="mr-2"> Comprar</label>
                        <label class="border p-2 rounded flex items-center"><input type="radio" name="op" class="mr-2"> Alquilar</label>
                    </div>
                    <label class="block mt-2">Tipo:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center"><input type="checkbox" class="mr-2"> Casa</label>
                        <label class="flex items-center"><input type="checkbox" class="mr-2"> Depto</label>
                        <label class="flex items-center"><input type="checkbox" class="mr-2"> Terreno</label>
                        <label class="flex items-center"><input type="checkbox" class="mr-2"> Local</label>
                    </div>
                </div>
                <button class="w-full bg-blue-600 text-white font-bold py-4 rounded hover:bg-blue-700 transition">Enviar Preferencias</button>
            </form>
        </div>
    </div>
</body>
</html>
